<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="عرض تفاعلي عن الهندسة العكسية والتوصيات والخصوصية الرقمية">
  <title>Behind the Algorithm | شو بصير ورا الشاشة؟</title>
  <link rel="stylesheet" href="assets/fonts/cairo.css">
  <link rel="stylesheet" href="css/main.css">
  <script defer src="js/slides-data.js"></script>
  <script defer src="js/diagrams.js"></script>
  <script defer src="js/demos.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <main id="presentation" aria-label="العرض التقديمي">
    <div id="viewport">
      <div id="stage">
        <div id="slide"></div>
        <header class="masthead" dir="ltr">
          <button class="wordmark" id="first" type="button" title="أول شريحة" aria-label="أول شريحة">
            <svg width="25" height="25" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3z" fill="currentColor"/><path d="M14 14h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>BEHIND THE ALGORITHM</span>
          </button>
          <div class="chapter" id="chapter" dir="rtl"></div>
        </header>
      </div>
    </div>
    <div class="mobile-demos" id="mobile-demos" aria-label="عناصر التجربة" hidden></div>
    <footer class="toolbar" aria-label="أدوات العرض" dir="ltr">
      <div class="toolbar-start">
        <button class="control" id="overview-open" type="button" title="كل الشرائح (O)" aria-label="عرض كل الشرائح"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
        <button class="control" id="notes-open" type="button" title="ملاحظات (N)" aria-label="ملاحظات المتحدّث" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v15l-3 3H5zM8 8h8M8 12h8M8 16h4"/></svg></button>
        <button class="control" id="fullscreen" type="button" title="ملء الشاشة (F)" aria-label="ملء الشاشة" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg></button>
      </div>
      <div class="transport" dir="rtl">
        <button class="control nav-control" id="previous" type="button" title="الشريحة السابقة (→)" aria-label="الشريحة السابقة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
        <span class="counter" id="counter" dir="ltr" aria-hidden="true"></span>
        <button class="control nav-control" id="next" type="button" title="الشريحة التالية (←)" aria-label="الشريحة التالية"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg></button>
      </div>
      <div id="chapter-progress" class="chapter-progress" aria-label="انتقل إلى فصل"></div>
      <progress id="progress" class="progress" value="1" max="42" aria-label="تقدّم العرض"></progress>
    </footer>
    <aside id="notes" class="notes" aria-labelledby="notes-heading" hidden>
      <div class="panel-head">
        <h2 id="notes-heading">ملاحظات المتحدّث</h2>
        <button type="button" class="control" id="notes-close" aria-label="إخفاء الملاحظات">×</button>
      </div>
      <p id="notes-copy"></p>
      <button type="button" id="presenter-open" class="panel-button">افتح نافذة المتحدّث</button>
    </aside>
    <dialog id="overview" aria-labelledby="overview-heading">
      <div class="panel-head">
        <h2 id="overview-heading">كل الشرائح</h2>
        <button class="control" id="overview-close" type="button" aria-label="إغلاق الفهرس">×</button>
      </div>
      <div id="overview-list" class="overview-list"></div>
    </dialog>
    <p id="fullscreen-help" class="fullscreen-help" role="status" hidden></p>
    <p id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></p>
    <noscript><p class="noscript">فعّل JavaScript لعرض الشرائح.</p></noscript>
  </main>
</body>
</html>
