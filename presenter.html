<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speaker notes | Behind the Algorithm</title>
  <link rel="stylesheet" href="css/main.css">
  <script defer src="js/slides-data.js"></script>
  <script defer src="js/presenter.js"></script>
</head>
<body class="presenter-page">
  <main class="presenter-wrap">
    <div class="counter" id="presenter-counter"></div>
    <h1 id="presenter-title"></h1>
    <p id="presenter-notes"></p>
    <nav class="presenter-transport" aria-label="Slide navigation">
      <button type="button" class="panel-button" id="presenter-prev">Previous</button>
      <button type="button" class="panel-button" id="presenter-next">Next</button>
    </nav>
    <noscript><p>Enable JavaScript to show speaker notes.</p></noscript>
  </main>
</body>
</html>
